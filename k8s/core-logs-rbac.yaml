apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tau-core-log-reader
  namespace: tau-core
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tau-core-log-reader
  namespace: tau-core
subjects:
  - kind: ServiceAccount
    name: tau-core
    namespace: tau-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tau-core-log-reader
