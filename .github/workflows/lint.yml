name: Lint

on:
  push:
    branches: [main]
  pull_request:
    # Exact theme-stack PR bases; push/publishing still run only on main.
    # Keep these explicit (not work/**) and remove them after the rollout.
    branches:
      - main
      - initiative/color-themes
      - work/d5bac5a5-1e6a-478d-a3b9-2d39d7c3a0d2
      - work/5eeab375-9778-4300-98f3-42a7f10ce187
      - work/7222b300-c1a1-4751-8da8-b43498711dfc
      - work/9dac31b6-a6b5-4f51-83a7-1b75dac8ad3d
      - work/94ffeaa8-42d3-4c06-b2d4-9abcb0768f43

# Same posture as ci.yml: supersede a PR's own earlier runs, never a run on
# main. Lint is only ~1.3 minutes, but it fires on exactly the same push
# volume as CI does.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint
