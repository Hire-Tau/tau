<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Tau</title>

    <!-- PWA manifest link is injected at build time by vite-plugin-pwa
         (base-path aware manifest.webmanifest). -->

    <!-- Theme Color: initial light surface; the flash-prevention script below and
         ThemeProvider keep it in sync with the active theme's surface color. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 'default' on purpose: on iOS 26 the translucent style shortens the webview
         by the status-bar height at the BOTTOM (viewport 812 on an 874pt screen),
         double-reports safe-area insets, and overlays an uncontrollable gray
         legibility scrim (with a visible hairline edge) on the top strip.
         'default' gives a full-height webview below an opaque bar that iOS colors
         from the system appearance / dynamic theme-color meta. NOTE: iOS snapshots
         this at Add-to-Home-Screen; changes require reinstalling the app icon. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tau" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS Splash Screens (generated for common device sizes) -->
    <link
      rel="apple-touch-startup-image"
      href="/icons/icon-512x512.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />

    <!-- Microsoft Tile -->
    <meta name="msapplication-TileColor" content="#7c3aed" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- Description for SEO and sharing. __TAU_ORIGIN__ is replaced by the
         server (apps/core/src/lib/web-serve.ts) with this instance's public
         origin: link crawlers ignore relative og:image / og:url values. -->
    <meta name="description" content="A workspace for teams of AI agents. Self-hosted, with an optional cloud." />
    <meta property="og:title" content="Tau" />
    <meta
      property="og:description"
      content="A workspace for teams of AI agents. Self-hosted, with an optional cloud."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tau" />
    <meta property="og:url" content="__TAU_ORIGIN__/" />
    <meta property="og:image" content="__TAU_ORIGIN__/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Tau: a workspace for teams of AI agents. Self-hosted, with an optional cloud."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tau" />
    <meta
      name="twitter:description"
      content="A workspace for teams of AI agents. Self-hosted, with an optional cloud."
    />
    <meta name="twitter:image" content="__TAU_ORIGIN__/social-preview.png" />

    <!-- Prevent telephone number detection on iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Flash prevention script: resolves (themeId, appearance, system) before
         first paint and applies data-theme / data-appearance / the legacy dark
         class, plus the resolved-surface snapshot so any stored theme paints
         without a flash of the default theme. Mirrors the shared
         resolveThemeSelection fallback rules; kept dependency-free because it
         runs before any module. Covered by src/theme/flashScript.test.ts. -->
    <script data-tau-theme-flash>
      ;(function () {
        try {
          var root = document.documentElement
          var stored = { themeId: null, appearance: null, legacyTheme: null }
          try {
            stored.themeId = localStorage.getItem('tau-theme-id')
            stored.appearance = localStorage.getItem('tau-appearance')
            stored.legacyTheme = localStorage.getItem('tau-theme')
          } catch (e) {
            /* unreadable storage behaves as empty: defaults apply */
          }
          // Registered theme ids today: 'tau'. Unknown or missing ids resolve
          // to it (shared fallback rule: unknown theme id -> default pair).
          var themeId = stored.themeId === 'tau' ? stored.themeId : 'tau'
          var appearance = stored.appearance
          if (appearance !== 'light' && appearance !== 'dark' && appearance !== 'system') {
            appearance = stored.legacyTheme === 'dark' ? 'dark' : 'light'
          }
          var resolved = appearance
          if (appearance === 'system') {
            try {
              resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
            } catch (e) {
              resolved = 'light'
            }
          }
          root.setAttribute('data-theme', themeId)
          root.setAttribute('data-appearance', resolved)
          if (resolved === 'dark') {
            root.classList.add('dark')
          } else {
            root.classList.remove('dark')
          }
          // Resolved-surface snapshot: prefer the state-keyed snapshot. The
          // legacy plain string carries no state, so it applies only while the
          // structured key has never been written (pre-upgrade browsers) and
          // only under the tau theme it was written with.
          var surface = null
          var rawSnapshot = null
          try {
            rawSnapshot = localStorage.getItem('tau-theme-surface')
          } catch (e) {
            rawSnapshot = null
          }
          if (rawSnapshot != null) {
            try {
              var snap = JSON.parse(rawSnapshot)
              if (
                snap &&
                snap.theme === themeId &&
                snap.appearance === resolved &&
                typeof snap.surface === 'string' &&
                snap.surface
              ) {
                surface = snap.surface
              }
              // A structured snapshot exists but does not match this state:
              // paint from CSS rather than trusting a possibly-stale value.
            } catch (e) {
              /* corrupt snapshot: paint from CSS instead of guessing */
            }
          } else if (themeId === 'tau') {
            try {
              surface = localStorage.getItem('tau-surface-color')
            } catch (e) {
              surface = null
            }
          }
          if (surface) {
            root.style.backgroundColor = surface
            var meta = document.querySelector("meta[name='theme-color']")
            if (meta) meta.setAttribute('content', surface)
          }
        } catch (e) {
          /* never block first paint on theme resolution */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
