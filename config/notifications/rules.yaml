# Notification rules - routes events to channels
#
# NOTE: To send to push or external channels (discord, slack, telegram), the event type
# must have a builder in apps/core/src/services/notifications/event-builders.ts.
# The builder constructs the notification title, body, and URL from the event data.
# Push fans the shared notification out through browser web-push and native APNs.
#
# Only two events can reach the push channel: agent-question.created (recipients come from the
# question's persisted attention audience) and inbox.messageReceived (the message's recipient).
# Other events carry no recipient, so a `push` channel on them delivers nothing. Work-stream
# lifecycle pushes reach people as the inbox notices sent to watchers.
#
# Supported events with builders:
#   - agent-question.created
#   - workStream.blocked, workStream.review, workStream.done
#   - workStream.created, workStream.updated
#   - inbox.messageReceived (including saved Assistant task updates)
#   - execution.completed, execution.failed

rules:
  # Async questions use persisted owner + authorized squad-watcher recipient resolution.
  - event: 'agent-question.created'
    channels: [push]

  # Work stream events - notify external channels. Blocked remains available to explicit
  # custom rules but is intentionally absent from bundled human-attention routes.
  - event: 'workStream.review'
    channels: [discord, slack, telegram]

  - event: 'workStream.done'
    channels: [discord, slack, telegram]

  # Human fleet operator alerts retain system-inbox push routing and additionally fan out through
  # configured squad channels. Manager fleet messages use source fleet-incident-manager and an
  # agent recipient, so they cannot match this or the generic human inbox rule. This must remain
  # before generic inbox routing (first match wins).
  - id: 'fleet-operator-alert'
    event: 'inbox.messageReceived'
    match:
      source: 'fleet-alert'
    channels: [push, discord, slack, telegram]

  # Saved Assistant conversations: only actionable task updates (needs input, completed, failed on
  # the current request) push. The flag is server-derived in InboxMessage; routine progress only
  # refreshes the Assistant badge. Delivery is filtered to the conversation owner in the service.
  - id: 'assistant-task-update'
    event: 'inbox.messageReceived'
    match:
      recipientType: 'voice_assistant'
      assistantPush: true
    channels: [push]

  # Inbox messages to a user (personal inbox) or the shared system inbox - web and native push.
  # Push delivery is filtered per-recipient in the notification service (user → that user's devices;
  # system → holders of inbox:system).
  - event: 'inbox.messageReceived'
    match:
      recipientType: ['user', 'system']
    channels: [push]

  # Failures - console and external channels (no recipient, so no push)
  - event: 'execution.failed'
    channels: [console, discord, slack, telegram]

  # Normal lifecycle events - console only
  - event: 'execution.completed'
    channels: [console]

  - event: 'workStream.created'
    channels: [console]

  - event: 'workStream.updated'
    channels: [console]

channels:
  push:
    enabled: true
  console:
    enabled: true
  discord:
    enabled: true
  slack:
    enabled: true
  telegram:
    enabled: true
