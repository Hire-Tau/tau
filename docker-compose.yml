services:
  registry:
    image: registry:2
    container_name: tau-registry
    ports:
      - '127.0.0.1:5001:5000'
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - tau-dev
    restart: unless-stopped

  postgres:
    image: paradedb/paradedb:latest
    container_name: postgres-tau
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tau
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  registry-data:
  postgres-data:

networks:
  tau-dev:
    name: tau-dev
